<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mimi Ribbon home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
body { margin: 0; background: #FBEFF3; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
button:focus-visible { outline: 2px solid #231A21; outline-offset: 2px; }
.b-shell { position: relative; z-index: 2; display: flex; flex-direction: column; height: 800px; box-sizing: border-box; width: 58%; padding: 20px 8px 24px 32px; }
.b-mimi { position: absolute; right: -6px; top: 34px; height: 980px; width: auto; animation: b-float 5s ease-in-out infinite; }
.b-ribbon { position: absolute; left: 64%; top: -220px; width: 300px; height: 1300px; background: #F0357F; transform: rotate(12deg); transform-origin: center; overflow: hidden; }
.b-ribbon.on { animation: b-pulse 1.2s ease-in-out infinite; }
.b-stripe { position: absolute; left: calc(64% + 330px); top: -220px; width: 22px; height: 1300px; background: #F7A6C6; transform: rotate(12deg); }
.b-ghost { position: absolute; left: 14px; top: 250px; writing-mode: vertical-rl; font-weight: 800; font-size: 74px; line-height: 1; letter-spacing: 3px; color: #D61E68; white-space: nowrap; user-select: none; }
.b-bar { display: block; width: 4px; border-radius: 2px; background: #B8145F; animation: b-bar 800ms ease-in-out infinite alternate; }
.b-scroll { overflow-y: auto; scrollbar-width: thin; scrollbar-color: #D9A9BC transparent; }
.b-win { position: absolute; z-index: 3; top: 8px; right: 8px; display: flex; }
@keyframes b-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
@keyframes b-bar { from { transform: scaleY(0.25); } to { transform: scaleY(1); } }
@keyframes b-pulse { 0%, 100% { background: #F0357F; } 50% { background: #F85C98; } }
@media (prefers-reduced-motion: reduce) { .b-mimi, .b-ribbon.on, .b-bar { animation: none; } }
@media (max-width: 960px) {
  .b-shell { width: 100%; height: auto; min-height: 800px; padding: 300px 16px 20px; }
  .b-mimi { height: 560px; top: 10px; right: 50%; margin-right: -177px; }
  .b-ribbon, .b-stripe, .b-ghost { display: none; }
}
</style>
</helmet>

<div style="position: relative; width: 100%; min-height: 800px; overflow: hidden; color: #231A21; font-family: 'M PLUS Rounded 1c', sans-serif; background: #FBEFF3;">

  <div aria-hidden="true" class="b-ribbon {{ribbonClass}}"><div class="b-ghost">SPEAK. MIMI TYPES.</div></div>
  <div aria-hidden="true" class="b-stripe"></div>
  <img class="b-mimi" src="/_blob/1a9d78db8fdcf866293e9320f6cc33c1" alt="Mimi, a smiling anime girl with long pink twin tails, cat-ear headband and headphones around her neck">

  <div class="b-win">
    <button type="button" aria-label="Minimize window" style="width: 44px; height: 44px; display: grid; place-items: center; border-radius: 22px;">
      <svg aria-hidden="true" width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#231A21" stroke-width="1.8" stroke-linecap="round"><path d="M2 7h10"></path></svg>
    </button>
    <button type="button" aria-label="Hide Mimi to the system tray" style="width: 44px; height: 44px; display: grid; place-items: center; border-radius: 22px;">
      <svg aria-hidden="true" width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#231A21" stroke-width="1.8" stroke-linecap="round"><path d="M3 3l8 8M11 3l-8 8"></path></svg>
    </button>
  </div>

  <main class="b-shell">
    <header style="display: flex; align-items: center; flex-wrap: wrap; gap: 8px 24px; flex: none;">
      <span style="font-weight: 800; font-size: 32px; line-height: 1; color: #B8145F;">mimi</span>
      <nav aria-label="Main" style="display: flex; gap: 4px;">
        <button type="button" aria-current="page" style="height: 44px; padding: 0 18px; border-radius: 22px; background: #231A21; color: #FFFFFF; font-weight: 700; font-size: 14px;">Home</button>
        <button type="button" style="height: 44px; padding: 0 18px; border-radius: 22px; font-weight: 700; font-size: 14px;">Snippets</button>
        <button type="button" style="height: 44px; padding: 0 18px; border-radius: 22px; font-weight: 700; font-size: 14px;">Settings</button>
      </nav>
    </header>

    <ul class="b-scroll" aria-label="History" style="list-style: none; margin: 16px 0; padding: 0 18px 0 0; display: flex; flex-direction: column-reverse; gap: 16px; flex: 1 1 0; min-height: 0;">
      <sc-if value="{{isListening}}" hint-placeholder-val="{{false}}">
        <li style="align-self: flex-end;">
          <div style="display: flex; align-items: center; gap: 3px; height: 54px; padding: 0 22px; background: #FFFFFF; border-radius: 22px 22px 6px 22px;">
            <sc-for list="{{bars}}" as="bar" hint-placeholder-count="16">
              <span class="b-bar" style="height: {{bar.h}}; animation-delay: {{bar.delay}};"></span>
            </sc-for>
          </div>
        </li>
      </sc-if>
      <sc-for list="{{entries}}" as="entry" hint-placeholder-count="4">
        <li style="align-self: flex-end; max-width: 88%;">
          <div style="padding: 14px 20px; background: #FFFFFF; border-radius: 22px 22px 6px 22px; font-weight: 500; font-size: 16px; line-height: 1.5;">{{entry.text}}</div>
          <div style="display: flex; align-items: center; justify-content: flex-end; gap: 4px; margin-top: 2px; font-weight: 500; font-size: 13px; color: #6B5560;">
            <span>{{entry.app}}, {{entry.time}}</span>
            <button type="button" onClick="{{entry.copy}}" style="display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 10px; border-radius: 22px; font-weight: 700; font-size: 13px; color: #231A21;">
              <sc-if value="{{entry.isCopied}}" hint-placeholder-val="{{false}}">
                <svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#B8145F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.5 3.5L13 4.5"></path></svg>
              </sc-if>
              <sc-if value="{{entry.notCopied}}" hint-placeholder-val="{{true}}">
                <svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#231A21" stroke-width="1.6" stroke-linejoin="round"><rect x="5.5" y="5.5" width="8" height="9" rx="2"></rect><path d="M10.5 5.5V3.5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h1"></path></svg>
              </sc-if>
              <span>{{entry.copyLabel}}</span>
            </button>
          </div>
        </li>
      </sc-for>
    </ul>

    <div style="display: flex; align-items: center; gap: 14px; flex: none; min-height: 76px; padding: 10px 24px 10px 10px; box-sizing: border-box; background: #FFFFFF; border-radius: 38px; margin-right: 18px;">
      <button type="button" onClick="{{toggle}}" disabled="{{isWorking}}" aria-label="{{buttonLabel}}" style="flex: none; width: 56px; height: 56px; display: grid; place-items: center; border-radius: 28px; background: {{buttonColor}};">
        <sc-if value="{{showMic}}" hint-placeholder-val="{{true}}">
          <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#231A21" stroke-width="2" stroke-linecap="round"><rect x="8.5" y="3" width="7" height="12" rx="3.5"></rect><path d="M5 11.5a7 7 0 0 0 14 0M12 18.5V21"></path></svg>
        </sc-if>
        <sc-if value="{{isListening}}" hint-placeholder-val="{{false}}">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="#231A21"><rect x="4" y="4" width="12" height="12" rx="2.5"></rect></svg>
        </sc-if>
      </button>
      <div role="status" style="flex: 1 1 auto; min-width: 0;">
        <p style="margin: 0; font-weight: 800; font-size: 17px; line-height: 1.3;">{{statusLine}}</p>
        <p style="margin: 0; font-weight: 500; font-size: 13px; line-height: 1.4; color: #6B5560;">{{subLine}}</p>
      </div>
      <p style="margin: 0; flex: none; font-weight: 700; font-size: 13px; line-height: 1.4; text-align: right; color: #6B5560;">Español / English<br>Offline</p>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      phase: 'idle',
      copied: null,
      demoIndex: 0,
      entries: [
        { id: 3, app: 'WhatsApp', time: '12:41', text: 'Llego en veinte minutos. Guárdame un sitio, por favor.' },
        { id: 2, app: 'ChatGPT', time: '11:58', text: 'Give me five title ideas for a short video about old Tokyo train stations.' },
        { id: 1, app: 'Gmail', time: '10:15', text: 'Hola Andrea, te confirmo la reunión del jueves a las diez. Te mando el enlace por correo.' }
      ]
    };
    this.demoLines = [
      { app: 'Word', text: 'Can you send me the final cut by Friday? I would like to review it before the weekend.' },
      { app: 'Gmail', text: 'Muchas gracias por tu ayuda. Te escribo la próxima semana con más detalles.' }
    ];
    this.nextId = 4;
  }
  componentWillUnmount() {
    clearTimeout(this.workTimer);
    clearTimeout(this.copyTimer);
  }
  toggle() {
    if (this.state.phase === 'idle') {
      this.setState({ phase: 'listening' });
    } else if (this.state.phase === 'listening') {
      this.setState({ phase: 'working' });
      this.workTimer = setTimeout(() => {
        const line = this.demoLines[this.state.demoIndex % this.demoLines.length];
        this.setState({
          phase: 'idle',
          demoIndex: this.state.demoIndex + 1,
          entries: [{ id: this.nextId++, app: line.app, time: 'Just now', text: line.text }].concat(this.state.entries)
        });
      }, 500);
    }
  }
  copy(entry) {
    try {
      if (navigator.clipboard) navigator.clipboard.writeText(entry.text).catch(() => {});
    } catch (error) {}
    this.setState({ copied: entry.id });
    clearTimeout(this.copyTimer);
    this.copyTimer = setTimeout(() => this.setState({ copied: null }), 1800);
  }
  renderVals() {
    const phase = this.state.phase;
    const heights = [12, 22, 32, 18, 36, 26, 14, 30, 36, 20, 12, 28, 34, 16, 26, 20];
    return {
      statusLine: phase === 'listening' ? "I'm listening" : phase === 'working' ? 'Typing it for you' : 'Press Ctrl + Space and talk',
      subLine: phase === 'listening' ? 'Press again when you finish' : 'Your text goes into the box you are using, and stays here too',
      buttonLabel: phase === 'listening' ? 'Stop and type' : 'Start talking',
      buttonColor: phase === 'listening' ? '#F7A6C6' : '#F0357F',
      isWorking: phase === 'working',
      isListening: phase === 'listening',
      showMic: phase !== 'listening',
      ribbonClass: phase === 'listening' ? 'on' : '',
      toggle: () => this.toggle(),
      bars: heights.map((h, i) => ({ h: h + 'px', delay: (i * 67) % 800 + 'ms' })),
      entries: this.state.entries.map((entry) => ({
        ...entry,
        isCopied: this.state.copied === entry.id,
        notCopied: this.state.copied !== entry.id,
        copyLabel: this.state.copied === entry.id ? 'Copied' : 'Copy',
        copy: () => this.copy(entry)
      }))
    };
  }
}
</script>
</body>
</html>
